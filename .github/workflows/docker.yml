name: Docker image

# Builds the server image (game + leaderboard API) and publishes it to the GitHub Container Registry:
#   ghcr.io/<owner>/gigabash:<version>, :<major>.<minor>, :latest   on a version tag (v1.2.3)
#   ghcr.io/<owner>/gigabash:edge                                    on every push to main
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The Docker build has no .git: write version, commit and date for the build into VERSION
      - name: Version file
        run: node scripts/version.mjs --deploy > VERSION && cat VERSION

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Oganesson GigaBash
            org.opencontainers.image.description=Vertical space shooter for the browser – sectors, bosses, a weapon shop and a big skill tree, with a server-verified leaderboard
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
