<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oganesson" />
    <meta name="theme-color" content="#070814" />
    <meta name="format-detection" content="telephone=no" />
    <title>Oganesson GigaBash</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="frame">
      <!-- Säule = Spielfeld (9:16) plus die HUD-Leisten darüber/darunter, falls Platz ist -->
      <div id="col">
        <div id="field">
          <div id="game"></div>
          <div id="banner"></div>
        </div>
        <div id="hud" hidden>
          <div class="hud-top">
            <div class="pill score" title="Punkte"><b id="h-score">0</b></div>
            <div class="pill credits" title="Credits"><span class="cr">◆</span><b id="h-credits">0</b></div>
            <button id="btn-pause" class="hbtn" title="Pause [P / Esc]" aria-label="Pause">❚❚</button>
          </div>
          <div class="hud-sub">
            <span id="h-sector">SEKTOR 1</span>
            <span class="gun" title="Waffenstufe"><span class="lbl">P</span><span id="h-gun" class="pips"></span></span>
            <span class="dps" title="Feuerkraft: Schaden pro Sekunde, wenn alles trifft">DPS <b id="h-dps">0</b></span>
          </div>
          <div id="h-buffs" class="buffs"></div>
          <div id="bossbar" hidden><span>ENDGEGNER</span><div class="track"><i id="h-boss"></i></div></div>
          <div class="hud-bottom">
            <div class="bars">
              <div class="bar hull" title="Hülle"><i id="h-hull"></i><span id="h-hull-t">100</span></div>
              <div class="bar shield" id="shieldbar" title="Schild"><i id="h-shield"></i></div>
              <div class="bar graze" title="Streif-Leiste: knapp an Kugeln vorbeifliegen füllt sie, voll gibt es eine Bombe"><i id="h-graze"></i></div>
            </div>
            <div id="h-bombs" title="Smartbomben [B / Leertaste]"></div>
          </div>
          <div id="joy" class="idle"><div class="joy-knob"></div></div>
          <button id="btn-bomb" title="Smartbombe [B]"><span>BOMBE</span><b id="h-bomb-n" class="cnt">1</b></button>
        </div>
        <div id="tips"></div>
        <div id="overlay" hidden></div>
        <div id="dialog" hidden></div>
        <div id="ver"></div>
      </div>
    </div>
    <div id="rotate" hidden><div class="rot-ico">📱↻</div><p>Bitte das Handy hochkant halten</p><small>Das Spiel wartet so lange.</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
