# OGANESSON mit geteilter Bestenliste
#   SECRET=$(openssl rand -hex 32) ADMIN_TOKEN=$(openssl rand -hex 24) docker compose up -d --build
# oder die Werte in eine .env-Datei neben dieser Datei schreiben.
name: oganesson

services:
  oganesson:
    build:
      context: .
      # Build im Host-Netz: auf manchen Servern haben Container im Bridge-Netz keinen
      # Internetzugang (npm ci braucht ihn). Der laufende Container braucht keinen.
      network: host
    image: oganesson:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # Signaturschlüssel für Spielstarts (mind. 16 Zeichen, geheim halten)
      SECRET: ${SECRET:?Bitte SECRET setzen (z. B. openssl rand -hex 32)}
      # Token für DELETE /api/scores/:id und GET /api/telemetry (leer = Admin-Endpunkte aus)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DB_PATH: /data/oganesson.db
      # 1 nur hinter einem Reverse-Proxy, der X-Forwarded-For setzt (es zählt der letzte Eintrag)
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Replay-Nachsimulation: Worker-Threads, Zeitlimit (s), Warteschlange
      VERIFY_WORKERS: ${VERIFY_WORKERS:-1}
      VERIFY_TIMEOUT: ${VERIFY_TIMEOUT:-30}
      VERIFY_QUEUE: ${VERIFY_QUEUE:-20}
      # Anonyme Telemetrie (Replays aller Einsendungen ohne Name/IP) in der Datenbank; 0 = aus
      TELEMETRY: ${TELEMETRY:-1}
      # Öffentliche Adresse ohne / am Ende (absolute URLs für die Link-Vorschau), z. B. https://example.com/gigabash
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Impressum (§ 18 MStV) unter /impressum: Angaben nur in der Env-Datei auf dem Server, nie im Repo.
      # Adresse in Zeilen mit „|“ getrennt, z. B. IMPRESSUM_ADDRESS="Straße 1|12345 Ort"
      IMPRESSUM_NAME: ${IMPRESSUM_NAME:-}
      IMPRESSUM_ADDRESS: ${IMPRESSUM_ADDRESS:-}
      IMPRESSUM_EMAIL: ${IMPRESSUM_EMAIL:-}
      # Aufbewahrung der Zugriffsprotokolle des Reverse-Proxys in Tagen (nur für den Text der Datenschutzseite)
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - oganesson-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  oganesson-data:
